[build-system]
requires = ["setuptools >= 64"]
build-backend = "setuptools.build_meta"

[project]
name="sparow"
version="1.0.1"
requires-python = ">=3.11"
dependencies = ["Pyomo", "munch", "mpi-sppy", "or-topas", "pytest", "pytest-cov", "scikit-learn", "rich", "parameterized", "pyapprox", "pyapprox-benchmarks", "numpy>=2.2.6"]
readme = {file = "README.md", content-type = "text/markdown"}
description="Stochastic Programming And Related Optimization Workflows"
classifiers=[
        "Intended Audience :: End Users/Desktop",
        "Intended Audience :: Science/Research",
        #'License :: OSI Approved :: BSD License',
        "Natural Language :: English",
        #'Operating System :: MacOS',
        #'Operating System :: Microsoft :: Windows',
        "Operating System :: Unix",
        "Programming Language :: Python",
        "Programming Language :: Python :: 3",
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13",
        "Topic :: Scientific/Engineering :: Mathematics",
        "Topic :: Software Development :: Libraries :: Python Modules",
    ]

[project.optional-dependencies]
plot = [
    "pandas>=3.0.3",
    "matplotlib>=3.11.0",
]
